# VirtualHost Apache pour Garage Moderne
# À ajouter dans C:\xampp\apache\conf\extra\httpd-vhosts.conf
# puis redémarrer Apache via le panneau de contrôle XAMPP.

<VirtualHost *:80>
    ServerName garage-app.local
    DocumentRoot "C:/xampp/htdocs/garage/public"

    <Directory "C:/xampp/htdocs/garage/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Uploads photos 360°
    php_value upload_max_filesize 10M
    php_value post_max_size 12M
    php_value max_execution_time 120

    ErrorLog "logs/garage-error.log"
    CustomLog "logs/garage-access.log" common
</VirtualHost>

# À ajouter aussi dans C:\Windows\System32\drivers\etc\hosts :
# 127.0.0.1    garage-app.local